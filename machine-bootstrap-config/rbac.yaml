apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
  name: kro:controller:bootstrapconfigs
rules:
  - apiGroups:
      - kro.run
    resources:
      - bootstrapconfigs
    verbs:
      - "*"
  - apiGroups:
      - cluster.k8s.io
    resources:
      - machinedeployments
    verbs:
      - get
      - watch
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - "*"

